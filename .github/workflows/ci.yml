name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  qualidade:
    name: Tipos, lint e arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Biome (formatação e lint)
        run: npm run lint:biome

      - name: ESLint (regras do Next)
        run: npm run lint:next

      - name: Código morto e dependências não usadas
        run: npm run knip

      - name: Contratos de arquitetura
        run: npm run arch

  testes:
    name: Testes unitários e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Enviar cobertura ao Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unitarios
          # Sem o token configurado, o passo não derruba o build.
          fail_ci_if_error: false

  e2e:
    name: Playwright (fluxos, responsividade, acessibilidade)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Executar Playwright
        run: npx playwright test

      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mutacao:
    name: Teste de mutação
    runs-on: ubuntu-latest
    # Leva alguns minutos e mede a qualidade dos testes, não do produto:
    # roda só na main, para não atrasar o retorno em cada pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Stryker
        run: npm run test:mutation

      - name: Guardar relatório de mutação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mutacao
          path: reports/
          retention-days: 7
