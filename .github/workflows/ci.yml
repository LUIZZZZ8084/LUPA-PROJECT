name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # Vulnerabilidade conhecida em dependência de produção reprova a entrega.
  #
  # Só `--omit=dev` e só `high` para cima: alerta que dispara por
  # dependência de ferramenta, ou por severidade baixa que ninguém vai
  # tratar hoje, ensina o time a ignorar vermelho — e aí o alerta que
  # importa passa junto.
  dependencias:
    name: Dependências vulneráveis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Auditoria de produção
        run: npm audit --omit=dev --audit-level=high

  qualidade:
    name: Tipos, lint e arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Biome (formatação e lint)
        run: npm run lint:biome

      - name: ESLint (regras do Next)
        run: npm run lint:next

      - name: Código morto e dependências não usadas
        run: npm run knip

      - name: Contratos de arquitetura
        run: npm run arch

  testes:
    name: Testes unitários e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Enviar cobertura ao Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unitarios
          # Sem o token configurado, o passo não derruba o build.
          fail_ci_if_error: false

  e2e:
    name: Playwright (fluxos, responsividade, acessibilidade)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Executar Playwright
        run: npx playwright test

      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # O ROADMAP.md é o único lugar que responde "o que está pronto e o que
  # falta" sem obrigar ninguém a reconstruir a história a partir de PRs
  # mergeados. Ele já ficou errado uma vez, listando como pendentes três
  # coisas entregues — e documento que erra uma vez deixa de ser
  # consultado. Manter na mão dependia de alguém lembrar; lembrar falhou.
  roadmap:
    name: Roadmap em dia
    runs-on: ubuntu-latest
    steps:
      # Histórico completo: sem ele não dá para comparar com a base e
      # descobrir quais arquivos o PR mexeu.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Arquivos alterados
        id: diff
        if: github.event_name == 'pull_request'
        run: |
          echo "arquivos<<FIM" >> "$GITHUB_OUTPUT"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          echo "FIM" >> "$GITHUB_OUTPUT"

      # Sem `npm ci`: o script usa só o que vem no Node. Instalar
      # dependência para conferir um markdown seria dois minutos de CI em
      # cada PR sem nenhum ganho.
      - name: Conferir o ROADMAP.md
        run: node scripts/conferir-roadmap.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORPO_DO_PR: ${{ github.event.pull_request.body }}
          ARQUIVOS_ALTERADOS: ${{ steps.diff.outputs.arquivos }}

  mutacao:
    name: Teste de mutação
    runs-on: ubuntu-latest
    # Leva alguns minutos e mede a qualidade dos testes, não do produto:
    # roda só na main, para não atrasar o retorno em cada pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Stryker
        run: npm run test:mutation

      - name: Guardar relatório de mutação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mutacao
          path: reports/
          retention-days: 7
